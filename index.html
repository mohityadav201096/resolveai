<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ResolveAI — Dispute escalation for Indian consumers</title>
  <meta name="description" content="Upload your complaint, invoice, or support thread. ResolveAI reads it, maps your escalation path under Indian consumer law, and writes the email for you." />

  <!-- Inter font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles-v1.css" />
</head>
<body>
  <div id="root"></div>

  <!-- React + Babel (CDN, no build step) -->

  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>

  <!-- App scripts — order matters -->
  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="nav.jsx"></script>
  <script type="text/babel" src="landing.jsx"></script>

  <script type="text/babel" src="results.jsx"></script>
  <script type="text/babel" src="action.jsx"></script>

</html>
